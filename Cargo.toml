[workspace]
resolver = "2"
members = [
    "crates/apister_core",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Sunil K Sundaram"]
license = "MIT"
description = "High-performance native storage, CRC32, radix topic trie, and compression accelerator for apister"
repository = "https://github.com/sunilksundaram/apister"
homepage = "https://github.com/sunilksundaram/apister"
documentation = "https://github.com/sunilksundaram/apister"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
