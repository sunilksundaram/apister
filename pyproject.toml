[project]
name = "apister"
version = "0.1.0"
description = "Lightweight durable asyncio pub/sub with broker reconnect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.7"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Framework :: AsyncIO",
]

[project.scripts]
apister = "apister.main:main"

[project.optional-dependencies]
rabbitmq = ["aio-pika>=9.4"]
kafka = ["aiokafka>=0.12"]

[project.urls]
Homepage = "https://github.com/sunilksundaram/apister"
Repository = "https://github.com/sunilksundaram/apister"
PyPI = "https://pypi.org/project/apister/"
Issues = "https://github.com/sunilksundaram/apister/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.7.10",
    "coverage[toml]>=7.6.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["aio_pika", "aio_pika.*", "aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311"]

[tool.coverage.run]
source = ["src/apister"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
