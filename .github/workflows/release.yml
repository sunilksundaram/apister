name: Release

# ==============================================================================
# ATOMIC MULTI-REGISTRY RELEASE PIPELINE:
#
# Triggered exclusively when CI & Security Quality Gate succeeds on a version tag (v*).
# Reuses all pre-built artifacts, multi-OS test verifications, and security audits
# from ci.yml without performing ANY redundant builds or tests.
#
# Sequential All-or-Nothing Guarantee:
# 1. Publishes apister_core to Crates.io first.
# 2. Publishes apister and native wheels to PyPI iff Crates.io succeeds.
# 3. Creates GitHub Release iff both registries succeed.
#
# ┌────────────────────────────────────────────────────────┐
# │ Triggered from CI on tags: v* (workflow_call)          │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 1. Publish apister_core to Crates.io                   │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 2. Publish apister & Native Wheels to PyPI             │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 3. Create GitHub Release with Pre-Built Assets         │
# └────────────────────────────────────────────────────────┘
# ==============================================================================

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version string (e.g. 0.2.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version string (e.g. 0.2.0)'
        required: false
        type: string

jobs:
  # ============================================================================
  # SECTION 1: PUBLISH RUST CRATE TO CRATES.IO
  # ============================================================================
  publish-to-crates-io:
    name: 1. Publish apister_core to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Crates.io authentication token
        id: check-token
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: |
          if [ -z "$CARGO_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither CARGO_REGISTRY_TOKEN nor CARGO_TOKEN is set in repository secrets. Skipping crates.io publish."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish apister_core to crates.io
        if: steps.check-token.outputs.has_token == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: |
          set +e
          # cargo automatically picks up CARGO_REGISTRY_TOKEN from the environment
          OUTPUT=$(cargo publish --manifest-path crates/apister_core/Cargo.toml 2>&1)
          STATUS=$?
          echo "$OUTPUT"

          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -iq "already exists on crates.io"; then
              echo "::notice::Crate apister_core version already exists on crates.io; skipping."
              exit 0
            else
              echo "::error::cargo publish failed with code $STATUS"
              exit $STATUS
            fi
          fi

  # ============================================================================
  # SECTION 2: PUBLISH PYTHON PACKAGES TO PYPI
  # Reuses pre-built wheels and sdist from ci.yml artifacts
  # Runs iff Crates.io publish succeeded (or was safely skipped due to unconfigured token)
  # ============================================================================
  publish-to-pypi:
    name: 2. Publish apister to PyPI
    needs: [publish-to-crates-io]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apister
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Download pure Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Download all native wheels
        uses: actions/download-artifact@v4
        with:
          pattern: native-wheel-*
          path: dist/
          merge-multiple: true

      - name: Inspect distribution artifacts for publication
        run: |
          echo "=== Pre-built distribution assets ready for PyPI ==="
          ls -la dist/

      # Case A: If PYPI_API_TOKEN secret is provided, publish using token
      - name: Publish apister to PyPI (API Token)
        if: env.HAS_TOKEN == 'true'
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      # Case B: If PYPI_API_TOKEN secret is not set, publish using OIDC Trusted Publishing
      - name: Publish apister to PyPI (OIDC Trusted Publishing)
        if: env.HAS_TOKEN == 'false'
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # ============================================================================
  # SECTION 3: CREATE GITHUB RELEASE WITH PRE-BUILT ASSETS
  # Runs iff both Crates.io and PyPI registries have successfully published
  # ============================================================================
  github-release:
    name: 3. Create GitHub Release
    needs: [publish-to-crates-io, publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create GitHub release and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Download all native wheels
        uses: actions/download-artifact@v4
        with:
          pattern: native-wheel-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release with Pre-Built Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: apister ${{ github.ref_name || format('v{0}', inputs.version) }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
