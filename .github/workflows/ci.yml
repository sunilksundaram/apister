name: CI & Security Quality Gate

# ==============================================================================
# PIPELINE ARCHITECTURE & QUALITY GATES:
#
# ┌────────────────────────────────────────────────────────┐
# │ 1. CVE Security Audit (pip-audit & Bandit SAST)        │
# └────────────────────────────────────────────────────────┘
#                            ▲
# ┌──────────────────────────┴─────────────────────────────┐
# │ 2. Static Analysis (Ruff, Mypy, Clippy, Cargo Fmt)     │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 3. Unit & Regression Tests (Linux, macOS, and Windows) │
# └────────────────────────────────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 4. Distribution Build Verification (uv & Cargo Package)│
# └────────────────────────────────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 5. Native Rust Wheel Matrix (Linux, macOS, Windows)    │
# └────────────────────────────────────────────────────────┘
# ==============================================================================

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # SECTION 1: CVE SECURITY AUDIT & VULNERABILITY SCANNING
  # ============================================================================
  cve-security-audit:
    name: 1. CVE Security Audit (pip-audit & Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies & security scanners
        run: uv sync --all-extras --group dev

      - name: Scan dependencies for CVEs with pip-audit
        run: uv run pip-audit

      - name: Run Bandit AST security analysis (SAST)
        run: uv run bandit -r src -c pyproject.toml

  # ============================================================================
  # SECTION 2: STATIC ANALYSIS & LINTING (Python & Rust)
  # ============================================================================
  static-analysis:
    name: 2. Static Analysis (Python & Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --manifest-path crates/apister_core/Cargo.toml --check

      - name: Run Rust linter (cargo clippy)
        run: cargo clippy --manifest-path crates/apister_core/Cargo.toml --all-targets -- -D warnings

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install static analysis tools
        run: uv sync --all-extras --group dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Check Python code formatting
        run: uv run ruff format --check .

      - name: Run Mypy static type checker
        run: uv run mypy src tests

  # ============================================================================
  # SECTION 3: UNIT & REGRESSION TESTS (Linux, macOS, and Windows)
  # ============================================================================
  unit-regression-tests:
    name: 3. Unit & Regression Tests (${{ matrix.os }})
    needs: [cve-security-audit, static-analysis]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & dev tooling
        run: uv sync --all-extras --group dev

      - name: Build and install Rust native accelerator
        run: uv run maturin develop -m crates/apister_core/Cargo.toml --release

      - name: Run Unit & Regression Tests (with Coverage)
        run: |
          uv run coverage run -m unittest discover -s tests -p "test_*.py"
          uv run coverage report -m
          uv run coverage xml -o coverage.xml

      - name: Upload coverage artifact (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================================
  # SECTION 4: DISTRIBUTION BUILD VERIFICATION (Python & Cargo)
  # ============================================================================
  build-verification:
    name: 4. Distribution Build Verification
    needs: [unit-regression-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust crate packaging (cargo package)
        run: cargo package --manifest-path crates/apister_core/Cargo.toml --no-verify

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build sdist and wheel
        run: uv build

  # ============================================================================
  # SECTION 5: NATIVE RUST WHEEL MATRIX BUILD VERIFICATION
  # ============================================================================
  native-wheels:
    name: 5. Native Wheels (${{ matrix.os }} - ${{ matrix.target }})
    needs: [build-verification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native wheel with maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path crates/apister_core/Cargo.toml
          sdist: false
          manylinux: ${{ matrix.manylinux || 'off' }}
