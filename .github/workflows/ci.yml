name: CI & Security Quality Gate

# ==============================================================================
# PIPELINE ARCHITECTURE & QUALITY GATES:
#
# Pushes to main or PRs trigger this workflow:
# 1. Run security audits & static analysis.
# 2. Run multi-OS unit & regression tests (Linux, macOS, Windows).
# 3. Build Python sdist and all 4 native wheels (Linux, macOS ARM/Intel, Windows).
# 4. Verify Rust crate packaging.
# 5. Upload distribution artifacts and STOP.
#
# Releases are triggered separately by creating and pushing a Git tag (v*),
# which invokes release.yml to download and publish these verified artifacts.
#
# ┌────────────────────────────────────────────────────────┐
# │ 1. CVE Security Audit (pip-audit & Bandit SAST)        │
# └────────────────────────────────────────────────────────┘
#                            ▲
# ┌──────────────────────────┴─────────────────────────────┐
# │ 2. Static Analysis (Ruff, Mypy, Clippy, Cargo Fmt)     │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 3. Unit & Regression Tests (Linux, macOS, and Windows) │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
#              ┌─────────────┴─────────────┐
#              ▼                           ▼
# ┌────────────────────────┐  ┌────────────────────────┐
# │ 4. Build Python Sdist  │  │ 5. Build Native Wheels │
# │    (uv build --sdist)  │  │    (Linux/macOS/Win)   │
# └────────────┬───────────┘  └────────────┬───────────┘
#              │                           │
#              └─────────────┬─────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 6. Verify Rust Crate (cargo package)                   │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
#                       STOP & STORE
#          Artifacts preserved for release.yml
# ==============================================================================

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # SECTION 1: CVE SECURITY AUDIT & VULNERABILITY SCANNING
  # ============================================================================
  cve-security-audit:
    name: 1. CVE Security Audit (pip-audit & Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies & security scanners
        run: uv sync --all-extras --group dev

      - name: Scan dependencies for CVEs with pip-audit
        run: uv run pip-audit

      - name: Run Bandit AST security analysis (SAST)
        run: uv run bandit -r src -c pyproject.toml

  # ============================================================================
  # SECTION 2: STATIC ANALYSIS & LINTING (Python & Rust)
  # ============================================================================
  static-analysis:
    name: 2. Static Analysis (Python & Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Run Rust linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install static analysis tools
        run: uv sync --all-extras --group dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Check Python code formatting
        run: uv run ruff format --check .

      - name: Run Mypy static type checker
        run: uv run mypy src tests

  # ============================================================================
  # SECTION 3: UNIT & REGRESSION TESTS (Linux, macOS, and Windows)
  # ============================================================================
  unit-regression-tests:
    name: 3. Unit & Regression Tests (${{ matrix.os }})
    needs: [cve-security-audit, static-analysis]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & dev tooling
        run: uv sync --all-extras --group dev

      - name: Build and install Rust native accelerator
        run: uv run maturin develop --release

      - name: Run Unit & Regression Tests (with Coverage)
        run: |
          uv run coverage run -m unittest discover -s tests -p "test_*.py"
          uv run coverage report -m
          uv run coverage xml -o coverage.xml

      - name: Upload coverage artifact (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================================
  # SECTION 4: BUILD PYTHON DISTRIBUTIONS (Source Distribution)
  # ============================================================================
  build-python:
    name: 4. Build Source Distribution (sdist)
    needs: [unit-regression-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build source distribution (sdist)
        run: uv build --sdist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  # ============================================================================
  # SECTION 5: BUILD CROSS-PLATFORM NATIVE WHEELS (Maturin Matrix)
  # ============================================================================
  build-native-wheels:
    name: 5. Native Wheels (${{ matrix.os }} - ${{ matrix.target }})
    needs: [unit-regression-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
          # macOS Intel (x86_64) cross-compiled on Apple Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native wheel with maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sdist: false
          manylinux: ${{ matrix.manylinux || 'off' }}

      - name: Upload native wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-wheel-${{ matrix.target }}
          path: dist/*.whl

  # ============================================================================
  # SECTION 6: VERIFY RUST CRATE PACKAGING
  # ============================================================================
  verify-cargo-package:
    name: 6. Verify Rust Crate Packaging
    needs: [unit-regression-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust crate packaging (cargo package)
        run: cargo package -p apister_core --no-verify
