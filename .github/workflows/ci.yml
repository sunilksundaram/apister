name: CI & Security Quality Gate

# ==============================================================================
# PIPELINE ARCHITECTURE & QUALITY GATES:
#
# ┌────────────────────────────────────────────────────────┐
# │ 1. CVE Security Audit (pip-audit & Bandit SAST)        │
# └────────────────────────────────────────────────────────┘
#                            ▲
# ┌──────────────────────────┴─────────────────────────────┐
# │ 2. Static Analysis (Ruff, Mypy, Clippy, Cargo Fmt)     │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 3. Unit & Regression Tests (Linux, macOS, and Windows) │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
#              ┌─────────────┴─────────────┐
#              ▼                           ▼
# ┌────────────────────────┐  ┌────────────────────────┐
# │ 4. Build Python Sdist  │  │ 5. Build Native Wheels │
# │    & Wheel (uv build)  │  │    (Linux/macOS/Win)   │
# └────────────┬───────────┘  └────────────┬───────────┘
#              │                           │
#              └─────────────┬─────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 6. Verify Rust Crate (cargo package)                   │
# └──────────────────────────┬─────────────────────────────┘
#                            ▼
# ┌────────────────────────────────────────────────────────┐
# │ 7. Reusable Release Trigger (release.yml on Tags v*)   │
# │    Reuses builds & quality gates; no separate builds   │
# └────────────────────────────────────────────────────────┘
# ==============================================================================

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to PyPI, Crates.io & GitHub Releases (only applies if on a tag v*)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write
  id-token: write

jobs:
  # ============================================================================
  # SECTION 1: CVE SECURITY AUDIT & VULNERABILITY SCANNING
  # ============================================================================
  cve-security-audit:
    name: 1. CVE Security Audit (pip-audit & Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies & security scanners
        run: uv sync --all-extras --group dev

      - name: Scan dependencies for CVEs with pip-audit
        run: uv run pip-audit

      - name: Run Bandit AST security analysis (SAST)
        run: uv run bandit -r src -c pyproject.toml

  # ============================================================================
  # SECTION 2: STATIC ANALYSIS & LINTING (Python & Rust)
  # ============================================================================
  static-analysis:
    name: 2. Static Analysis (Python & Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --manifest-path crates/apister_core/Cargo.toml --check

      - name: Run Rust linter (cargo clippy)
        run: cargo clippy --manifest-path crates/apister_core/Cargo.toml --all-targets -- -D warnings

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install static analysis tools
        run: uv sync --all-extras --group dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Check Python code formatting
        run: uv run ruff format --check .

      - name: Run Mypy static type checker
        run: uv run mypy src tests

  # ============================================================================
  # SECTION 3: UNIT & REGRESSION TESTS (Linux, macOS, and Windows)
  # ============================================================================
  unit-regression-tests:
    name: 3. Unit & Regression Tests (${{ matrix.os }})
    needs: [cve-security-audit, static-analysis]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & dev tooling
        run: uv sync --all-extras --group dev

      - name: Build and install Rust native accelerator
        run: uv run maturin develop -m crates/apister_core/Cargo.toml --release

      - name: Run Unit & Regression Tests (with Coverage)
        run: |
          uv run coverage run -m unittest discover -s tests -p "test_*.py"
          uv run coverage report -m
          uv run coverage xml -o coverage.xml

      - name: Upload coverage artifact (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================================
  # SECTION 4: BUILD PYTHON DISTRIBUTIONS (Sdist & Pure Wheel)
  # ============================================================================
  build-python:
    name: 4. Build Python sdist & wheel
    needs: [unit-regression-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg-version.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Extract package version
        id: pkg-version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building apister version: ${VERSION}"

      - name: Build package distributions (wheel and sdist)
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  # ============================================================================
  # SECTION 5: BUILD CROSS-PLATFORM NATIVE WHEELS (Maturin Matrix)
  # ============================================================================
  build-native-wheels:
    name: 5. Native Wheels (${{ matrix.os }} - ${{ matrix.target }})
    needs: [unit-regression-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
          # macOS Intel (x86_64) cross-compiled on Apple Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native wheel with maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/apister_core/Cargo.toml
          sdist: false
          manylinux: ${{ matrix.manylinux || 'off' }}

      - name: Upload native wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-wheel-${{ matrix.target }}
          path: dist/*.whl

  # ============================================================================
  # SECTION 6: VERIFY RUST CRATE PACKAGING
  # ============================================================================
  verify-cargo-package:
    name: 6. Verify Rust Crate Packaging
    needs: [unit-regression-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust crate packaging (cargo package)
        run: cargo package --manifest-path crates/apister_core/Cargo.toml --no-verify

  # ============================================================================
  # SECTION 7: TRIGGER RELEASE & PUBLISH (On Tag Push Only)
  # Reuses artifacts and quality gates from sections 1-6 above; NO rebuilding!
  # ============================================================================
  release:
    name: 7. Publish Release (PyPI, Crates.io, GitHub Release)
    needs: [build-python, build-native-wheels, verify-cargo-package]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[no push]') &&
      !contains(github.ref_name, '-dryrun') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true')
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.build-python.outputs.version }}
    secrets: inherit
